name: sports_app
description: A digital sports media platform MVP.
publish_to: 'none'

version: 1.0.0+1

environment:
  # dart:js_interop'un extension type API'si (JSAny.isA) 3.4'te geldi;
  # web_bridge_web.dart onu kullaniyor.
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  app_links: ^7.0.0
  device_info_plus: ^12.4.0
  feedback: ^3.2.0
  firebase_core: ^4.5.0
  firebase_crashlytics: ^5.1.0
  firebase_messaging: ^16.1.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_tts: ^4.2.5
  google_fonts: ^6.1.0
  google_mobile_ads: ^7.0.0
  home_widget: ^0.9.0
  http: ^1.6.0
  image_cropper: ^12.1.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  live_activities: ^2.4.7
  livekit_client: ^2.6.5
  lottie: ^3.3.2
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.1
  purchases_flutter: ^9.15.1
  rive: 0.14.4
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  share_plus: ^12.0.1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  supabase_flutter: ^2.12.0
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  # dart:html'in yerine: deprecated degil ve Wasm derlemesinde calisir.
  web: ^1.1.0
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.13.1
  webview_flutter_web: ^0.2.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  network_image_mock: ^2.1.1

  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/brand/

# Uygulama ikonlari. Android ve iOS ikonlari Flutter sablonuyla byte-birebir
# ayniydi (md5 eslesti): uygulama varsayilan Flutter logosuyla yayina
# cikacakti. assets/brand/ altindaki PNG'ler marka paletinden (design_system.md
# primary #6c5a00 / primary_fixed #ffd709) uretilmis YER TUTUCU'dur. Gercek
# logo geldiginde ayni uc dosyayi degistirip su komutu calistirmak yeterli:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Adaptive icon Android 8+ icin beklenir; onceden hic tanimli degildi
  # (mipmap-anydpi-v26 klasoru yoktu).
  adaptive_icon_background: "assets/brand/app_icon_background.png"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/brand/app_icon.png"
    background_color: "#6c5a00"
    theme_color: "#ffd709"
