# ---------------------------------------------------------------------------
# Asagidaki dokuz fonksiyon config.toml'de hic tanimli degildi, yani CLI
# varsayilaniyla deploy oluyorlardi ve "bu uc JWT istiyor mu" sorusunun
# cevabi kodun disinda hicbir yerde yaziliydi. Her biri icin deger bilincle
# secildi.
# ---------------------------------------------------------------------------

# RevenueCat sunucularindan cagriliyor; kullanici JWT'si yok. Fonksiyon kendi
# paylasilan sirriyla (REVENUECAT_WEBHOOK_SECRET) fail-closed koruyor.
[functions.revenuecat_webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/revenuecat_webhook/index.ts"

# Ikisi de Authorization basligindaki JWT'yi kendi icinde auth.getUser() ile
# dogruluyor; kapida ikinci kez dogrulamak akisi bozar.
[functions.process-mini-game]
enabled = true
verify_jwt = false
entrypoint = "./functions/process-mini-game/index.ts"

[functions.finalize-mini-game]
enabled = true
