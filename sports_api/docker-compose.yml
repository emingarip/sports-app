services:
  db:
    image: postgres:17
    container_name: sports-api-db
    restart: always
    environment:
      POSTGRES_DB: sports_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_api"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sports_api_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    container_name: sports-api-app
    restart: always
    env_file:
      - .env
    environment:
      SPORTS_API_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sports_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host 8010 -> container 8000. Host'ta 8000 DigginAlpha backend'inde.
      - "127.0.0.1:8010:8000"

volumes:
  sports_api_postgres_data:
