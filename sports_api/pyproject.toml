[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sports-api"
version = "0.1.0"
description = "Canonical sports data API for SportsApp."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.10.0",
  # /ui router'i Form(...) kullaniyor; bu olmadan app import sirasinda coker.
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.41",
  "psycopg[binary]>=3.2.9",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]
scrape = [
  "playwright>=1.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = [
  # FastAPI'nin kendi deyimi: Depends(...) / Query(...) varsayilan argumanda
  # cagrilir. Kural bunlari isaretliyor ama duzeltmenin karsiligi yok.
  "B008",
  # Kod tabani bu kuraldan once yazildi; zorlamak ~100 dosyayi yeniden
  # sarmak demek. Yeni kodda satirlari kisa tutuyoruz, gecmisi yeniden
  # bicimlendirmiyoruz.
  "E501",
  # StrEnum'a gecmek str(x) davranisini degistirir ("MatchStatus.finished"
  # yerine "finished"). Bu degerler DB'ye ve JSON'a yaziliyor; kozmetik bir
  # kural icin serilestirme semantigini degistirmiyoruz.
  "UP042",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
  "app",
  "alembic",
  "alembic.ini",
  "README.md",
  "pyproject.toml",
]
