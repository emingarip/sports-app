name: Deploy Flutter Web to VPS

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'bugfix/**'
      - 'fix/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Web
        run: flutter build web --wasm --base-href "/" --release --dart-define-from-file=.env --dart-define=AI_SPORT_AGENT_BASE_URL=https://sports-agent.boskale.com

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "build/web/*"
          target: "/var/www/sportsapp-web"
          strip_components: 2

      - name: Deploy and Configure HTTPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Starting deployment to VPS..."
            
            mkdir -p /var/www/sportsapp-web
            chown -R www-data:www-data /var/www/sportsapp-web
            
            if [ ! -f /etc/nginx/sites-available/sportsapp ]; then
                echo "Creating initial Nginx configuration..."
                cat << 'EOF' > /etc/nginx/sites-available/sportsapp
            server {
                listen 80;
                server_name www.boskale.com boskale.com;
                root /var/www/sportsapp-web;
                index index.html index.htm;
                
                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            EOF
                
                ln -sf /etc/nginx/sites-available/sportsapp /etc/nginx/sites-enabled/
                nginx -t && systemctl reload nginx
            fi
            
            echo "Checking SSL..."
            if ! grep -q "ssl_certificate" /etc/nginx/sites-available/sportsapp; then
                echo "Running Certbot..."
                apt-get update && apt-get install -y certbot python3-certbot-nginx
                certbot --nginx -d www.boskale.com -d boskale.com --non-interactive --agree-tos -m admin@boskale.com --redirect
            fi

            echo "Configuring Flutter web cache headers..."
            mkdir -p /etc/nginx/snippets
            cat << 'EOF' > /etc/nginx/snippets/sportsapp-cache.conf
            location = /index.html {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
                try_files /index.html =404;
            }

            location = /flutter_bootstrap.js {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
                try_files /flutter_bootstrap.js =404;
            }

            location = /flutter_service_worker.js {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
                try_files /flutter_service_worker.js =404;
            }

            location = /firebase-messaging-sw.js {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
                try_files /firebase-messaging-sw.js =404;
            }

            location ~* \.(?:js|mjs|wasm|json)$ {
                add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
                try_files $uri =404;
            }

            location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|ttf|otf|woff|woff2)$ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                try_files $uri =404;
            }
            EOF

            if ! grep -q "sportsapp-cache.conf" /etc/nginx/sites-available/sportsapp; then
                python3 - << 'PY'
            from pathlib import Path
            path = Path('/etc/nginx/sites-available/sportsapp')
            text = path.read_text()
            marker = 'index index.html index.htm;'
            include = '                include /etc/nginx/snippets/sportsapp-cache.conf;'
            if include not in text:
                text = text.replace(marker, marker + '\n' + include, 1)
            path.write_text(text)
            PY
            fi
            
            nginx -t
            systemctl reload nginx
            echo "Deployment successful."
